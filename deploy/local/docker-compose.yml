# Local MVP stack. Core services and their dependencies start by default; the observability stack
# is opt-in: `docker compose --profile observability up -d`. The Sensor Simulator is opt-in too:
# `docker compose --profile sim up -d` (needs deploy/scripts/generate-simulator-scenario.sh first).
# Internal gRPC ports (9091 asset, 9092 telemetry, 9093 incident) are intentionally never published
# to the host; only the Gateway REST port and the UIs below are.

x-java-service: &java-service
  restart: unless-stopped
  mem_limit: ${JAVA_SERVICE_MEM_LIMIT:-768m}
  stop_grace_period: 40s
  environment: &java-env
    JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75 --enable-native-access=ALL-UNNAMED}

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${POSTGRES_DB:-coldguard}
  DB_USER: ${POSTGRES_USER:-coldguard}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-coldguard}

x-amqp-env: &amqp-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-coldguard}
  RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-coldguard}

services:
  gateway:
    <<: *java-service
    build:
      context: ../..
      dockerfile: apps/gateway/Dockerfile
    container_name: coldguard-gateway
    environment:
      <<: *java-env
      SERVER_PORT: 8080
      # (mTLS): must resolve to the Compose service name — it is also the SAN the
      # Incident Service certificate was issued for (deploy/scripts/generate-dev-certs.sh).
      INCIDENT_SERVICE_HOST: incident-service
      INCIDENT_SERVICE_GRPC_PORT: 9093
      # Same rule for the Asset Service certificate (SAN asset-service).
      ASSET_SERVICE_HOST: asset-service
      ASSET_SERVICE_GRPC_PORT: 9091
      # And for the Telemetry Service (SAN telemetry-service).
      TELEMETRY_SERVICE_HOST: telemetry-service
      TELEMETRY_SERVICE_GRPC_PORT: 9092
      TLS_CERTS_DIR: /certs
      # Signing key pair: only the Gateway mounts it (deploy/local/jwt, git-ignored).
      JWT_PRIVATE_KEY_PATH: /jwt/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /jwt/jwt-public.pem
      # Actuator lives on its own port, reachable inside the Compose network but not published.
      MANAGEMENT_PORT: 8090
      # Browser origins allowed to call the Gateway (the frontend dev server); empty = none.
      COLDGUARD_CORS_ALLOWED_ORIGINS: ${COLDGUARD_CORS_ALLOWED_ORIGINS:-}
      # POST /api/v1/incidents is a technical entry point (PLATFORM_ADMIN only); local only.
      COLDGUARD_TECHNICAL_ENDPOINTS_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./certs:/certs:ro
      - ./jwt:/jwt:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -sf http://localhost:8090/actuator/health/readiness | grep -q ''"status":"UP"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      asset-service:
        condition: service_healthy
      telemetry-service:
        condition: service_healthy
      incident-service:
        condition: service_healthy

  asset-service:
    <<: *java-service
    build:
      context: ../..
      dockerfile: apps/asset-service/Dockerfile
    container_name: coldguard-asset-service
    environment:
      <<: [*java-env, *db-env, *amqp-env]
      GRPC_SERVER_PORT: 9091
      TLS_CERTS_DIR: /certs
      # Placeholder academic value (90 days) so a calibration can be recorded in the local demo.
      ASSET_CALIBRATION_DEFAULT_VALIDITY: ${ASSET_CALIBRATION_DEFAULT_VALIDITY:-P90D}
      # How often the job moves sensors with an expired calibration to maintenance (5 minutes by
      # default; use '0 * * * * *' for every minute in a demo).
      ASSET_CALIBRATION_EXPIRY_CRON: "${ASSET_CALIBRATION_EXPIRY_CRON:-0 */5 * * * *}"
    volumes:
      - ./certs:/certs:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -sf http://localhost:8081/actuator/health/readiness | grep -q ''"status":"UP"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  telemetry-service:
    <<: *java-service
    build:
      context: ../..
      dockerfile: apps/telemetry-service/Dockerfile
    container_name: coldguard-telemetry-service
    environment:
      <<: [*java-env, *db-env, *amqp-env]
      GRPC_SERVER_PORT: 9092
      TLS_CERTS_DIR: /certs
      # Asset Service address; its certificate SAN is asset-service.
      ASSET_SERVICE_HOST: asset-service
      ASSET_SERVICE_GRPC_PORT: 9091
      # How often silent sensors are looked for (an academic placeholder).
      TELEMETRY_CONNECTIVITY_CHECK_INTERVAL: ${TELEMETRY_CONNECTIVITY_CHECK_INTERVAL:-30s}
    volumes:
      - ./certs:/certs:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -sf http://localhost:8082/actuator/health/readiness | grep -q ''"status":"UP"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      asset-service:
        condition: service_healthy

  incident-service:
    <<: *java-service
    build:
      context: ../..
      dockerfile: apps/incident-service/Dockerfile
    container_name: coldguard-incident-service
    environment:
      <<: [*java-env, *db-env, *amqp-env]
      GRPC_SERVER_PORT: 9093
      TLS_CERTS_DIR: /certs
      # Local demo users, one per role, all with the same password (never used outside local).
      IDENTITY_BOOTSTRAP_ENABLED: "true"
      DEMO_USERS_PASSWORD: ${DEMO_USERS_PASSWORD:?set DEMO_USERS_PASSWORD in deploy/local/.env}
    volumes:
      - ./certs:/certs:ro
    # gRPC (9093) stays intentionally unexposed to the host, mTLS or not — only the Actuator
    # HTTP port (8083, not published either) is reachable from inside the container, which is
    # exactly what this healthcheck uses.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -sf http://localhost:8083/actuator/health/readiness | grep -q ''"status":"UP"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    <<: *java-service
    build:
      context: ../..
      dockerfile: apps/notification-service/Dockerfile
    container_name: coldguard-notification-service
    environment:
      <<: [*java-env, *db-env, *amqp-env]
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -sf http://localhost:8084/actuator/health/readiness | grep -q ''"status":"UP"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  sensor-simulator:
    <<: *java-service
    profiles: ["sim"]
    build:
      context: ../..
      dockerfile: simulator/sensor-simulator/Dockerfile
    container_name: coldguard-sensor-simulator
    environment:
      <<: *java-env
      SERVER_PORT: 8085
      # Telemetry Service address; its certificate SAN is telemetry-service.
      TELEMETRY_SERVICE_HOST: telemetry-service
      TELEMETRY_SERVICE_GRPC_PORT: 9092
      TLS_CERTS_DIR: /certs
      SIMULATOR_SCENARIO_FILE: /config/scenario.yml
    volumes:
      - ./certs:/certs:ro
      # Generated by deploy/scripts/generate-simulator-scenario.sh (not versioned).
      - ./simulator/scenario.yml:/config/scenario.yml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -sf http://localhost:8085/actuator/health/readiness | grep -q ''"status":"UP"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      telemetry-service:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: coldguard-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coldguard}
      POSTGRES_USER: ${POSTGRES_USER:-coldguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coldguard}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-coldguard} -d ${POSTGRES_DB:-coldguard}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: coldguard-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-coldguard}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-coldguard}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: coldguard-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: coldguard-prometheus
    profiles: ["observability"]
    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: coldguard-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.2.0
    container_name: coldguard-loki
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki

volumes:
  postgres-data:
  rabbitmq-data:
  grafana-data:
  loki-data:

networks:
  default:
    name: coldguard-network
    driver: bridge
