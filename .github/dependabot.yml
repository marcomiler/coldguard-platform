version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/apps/gateway"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/apps/asset-service"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/apps/telemetry-service"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/apps/incident-service"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/apps/notification-service"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/simulator/sensor-simulator"
    schedule:
      interval: weekly
