openapi: 3.0.3
info:
  title: ColdGuard API
  version: 0.2.0
  description: |
    REST API of the ColdGuard Gateway, the only entry point to the platform. It is the contract the
    frontend integrates against.

    **Every operation carries `x-status`:**

    - `implemented`: it exists in the Gateway today and a test keeps this file and the code in sync.
    - `planned`: it is specified here so the frontend can build against it (with a mock) before the
      backend exists. Its shape may still change; it moves to `implemented` when its spec lands.

    `x-roles` lists the roles allowed to call it (the source of truth is
    `docs/security/authn-authz.md`; a test checks that both agree with the real security chain).

    **Conventions**

    - Authentication: `POST /auth/login` returns a Bearer token valid for one hour; there is no
      refresh token, so a `401` means "sign in again".
    - JSON in camelCase, instants in ISO-8601 UTC, enums without any protocol prefix.
    - Lists: `?page=0&size=20` returns `{items, page}`; time-ordered ones use a cursor,
      `?cursor=…&size=…`, and return `{items, nextCursor, hasMore}`. `size=0` or omitted selects the
      server default; the maximum is 100.
    - Errors are Problem Details (RFC 9457) with a stable machine-readable `code` and a
      `correlationId`, also sent as the `X-Correlation-Id` response header. Send that header yourself
      to correlate a request.
    - A fresh creation answers `201` (with `Location` when the resource can be fetched by id); an
      action on an existing resource answers `200` with the updated resource.

    **Legacy vocabulary.** `POST /incidents` and `POST /incidents/{incidentId}/close` still answer
    with protocol-prefixed enums (`IMPACT_HIGH`, `CRITICALITY_HIGH`). They will move to the shared
    vocabulary and to the incident shape below when the incident service is completed (SPEC-007);
    do not integrate them yet. See `LegacyCreateIncident*` and `LegacyCloseIncident*`.
servers:
  - url: http://localhost:8080/api/v1
    description: Local Docker Compose (the Gateway is the only published port)
tags:
  - name: Auth
  - name: Users
  - name: Organizations
  - name: Assets
  - name: Sensors
  - name: Telemetry
  - name: Incidents
  - name: Operations
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      description: Any failure (unknown user, wrong password, locked or disabled account) answers the same `401`.
      operationId: login
      security: []
      x-status: implemented
      x-roles: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /users:
    get:
      tags: [Users]
      summary: List users
      operationId: listUsers
      x-status: implemented
      x-roles: [PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      summary: Create a user
      operationId: createUser
      x-status: implemented
      x-roles: [PLATFORM_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{userId}:
    get:
      tags: [Users]
      summary: Get a user
      operationId: getUser
      x-status: implemented
      x-roles: [PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{userId}/roles:
    post:
      tags: [Users]
      summary: Assign a role
      description: A reason is required. Assigning a role the user already has changes nothing.
      operationId: assignRole
      x-status: implemented
      x-roles: [PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleChangeRequest' }
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Users]
      summary: Revoke a role
      description: |
        The role and the reason travel in the request body. The last enabled administrator cannot lose
        the `PLATFORM_ADMIN` role (`409`, `USER_STATE_CONFLICT`).
      operationId: revokeRole
      x-status: implemented
      x-roles: [PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleChangeRequest' }
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{userId}/enabled:
    post:
      tags: [Users]
      summary: Enable or disable a user
      description: A reason is required. The last enabled administrator cannot be disabled (`409`).
      operationId: setUserEnabled
      x-status: implemented
      x-roles: [PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnabledRequest' }
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /organizations:
    get:
      tags: [Organizations]
      summary: List organizations
      operationId: listOrganizations
      x-status: implemented
      x-roles: [PLATFORM_ADMIN, OPERATIONS_SUPERVISOR]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of organizations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Organizations]
      summary: Create an organization
      operationId: createOrganization
      x-status: implemented
      x-roles: [PLATFORM_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganizationRequest' }
      responses:
        '201':
          description: Created (organizations cannot be fetched by id, so there is no `Location`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /organizations/{organizationId}/sites:
    get:
      tags: [Organizations]
      summary: List the sites of an organization
      operationId: listSites
      x-status: implemented
      x-roles: [PLATFORM_ADMIN, OPERATIONS_SUPERVISOR]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of sites
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Organizations]
      summary: Create a site
      operationId: createSite
      x-status: implemented
      x-roles: [PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSiteRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /assets:
    get:
      tags: [Assets]
      summary: List assets (cold units)
      operationId: listAssets
      x-status: implemented
      x-roles: [PLATFORM_ADMIN, OPERATIONS_SUPERVISOR]
      parameters:
        - name: siteId
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of assets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Assets]
      summary: Register an asset
      operationId: registerAsset
      x-status: implemented
      x-roles: [PLATFORM_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterAssetRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /assets/{assetId}:
    get:
      tags: [Assets]
      summary: Get an asset
      operationId: getAsset
      x-status: implemented
      x-roles: [PLATFORM_ADMIN, OPERATIONS_SUPERVISOR]
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: The asset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Assets]
      summary: Update an asset
      description: |
        Partial update: a field that is absent or null stays as it is; a blank description clears it.
        `expectedVersion` must be the version you read; otherwise `409 CONCURRENT_MODIFICATION` (reload
        and retry). Sending nothing that changes writes nothing.
      operationId: updateAsset
      x-status: implemented
      x-roles: [PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/AssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAssetRequest' }
      responses:
        '200':
          description: The updated asset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sensors:
    get:
      tags: [Sensors]
      summary: List sensors
      operationId: listSensors
      x-status: implemented
      x-roles: [PLATFORM_ADMIN, OPERATIONS_SUPERVISOR]
      parameters:
        - name: assetId
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/SensorStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of sensors
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensorPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Sensors]
      summary: Register a sensor
      description: |
        The sensor starts `ACTIVE` and is attached to the asset. The initial calibration and the
        operational profile are optional; a calibration needs a validity, from the profile given here
        or the service default, otherwise `409 CALIBRATION_VALIDITY_NOT_CONFIGURED`.
      operationId: registerSensor
      x-status: implemented
      x-roles: [PLATFORM_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterSensorRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sensor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sensors/connectivity:
    get:
      tags: [Telemetry]
      summary: Connectivity of the sensors
      description: |
        Connectivity is independent of the lifecycle status. Lists the sensors that have sent at
        least one reading; a sensor that never reported has no entry. A sensor is flagged as lost
        once it stays silent for its expected reading interval times a tolerance factor (an
        academic placeholder, not a confirmed business value); the flag clears when a reading
        arrives. Leaving service (maintenance, inactive, retired) also clears it, and a sensor
        returning to `ACTIVE` gets a full interval before it can be flagged again.
      operationId: listConnectivity
      x-status: implemented
      x-roles: [PLATFORM_ADMIN, OPERATIONS_SUPERVISOR]
      parameters:
        - name: onlyLost
          in: query
          required: false
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of connectivity statuses
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectivityPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /sensors/{sensorId}:
    get:
      tags: [Sensors]
      summary: Get a sensor
      operationId: getSensor
      x-status: implemented
      x-roles: [PLATFORM_ADMIN, OPERATIONS_SUPERVISOR]
      parameters:
        - $ref: '#/components/parameters/SensorId'
      responses:
        '200':
          description: The sensor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sensor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Sensors]
      summary: Update a sensor's technical data
      description: Absent or null fields stay as they are. `expectedVersion` guards against a concurrent change.
      operationId: updateSensor
      x-status: implemented
      x-roles: [PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/SensorId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSensorRequest' }
      responses:
        '200':
          description: The updated sensor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sensor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sensors/{sensorId}/profile:
    get:
      tags: [Sensors]
      summary: Get the operational profile
      operationId: getProfile
      x-status: implemented
      x-roles: [PLATFORM_ADMIN, OPERATIONS_SUPERVISOR]
      parameters:
        - $ref: '#/components/parameters/SensorId'
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationalProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Sensors]
      summary: Create or replace the operational profile
      description: |
        `version` is the version you read (absent or 0 when creating). The service enforces the
        invariants (range, ordering of the magnitude bands, positive durations) and answers `400`.
        Sending an identical profile changes nothing.
      operationId: putProfile
      x-status: implemented
      x-roles: [PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/SensorId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperationalProfileRequest' }
      responses:
        '200':
          description: The stored profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationalProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sensors/{sensorId}/status:
    post:
      tags: [Sensors]
      summary: Change the sensor status
      description: |
        Allowed: any non-final status to `IN_MAINTENANCE`, `INACTIVE` or `RETIRED`. To `ACTIVE`: from
        `IN_MAINTENANCE` it needs a calibration recorded after entering maintenance
        (`CALIBRATION_EVIDENCE_REQUIRED`) that is still valid (`CALIBRATION_EXPIRED`); from `INACTIVE`
        it needs a calibration that has not expired. `RETIRED` is final. Anything else answers
        `409 SENSOR_TRANSITION_NOT_ALLOWED`.
      operationId: changeSensorStatus
      x-status: implemented
      x-roles: [PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/SensorId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusChangeRequest' }
      responses:
        '200':
          description: The updated sensor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sensor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sensors/{sensorId}/calibrations:
    post:
      tags: [Sensors]
      summary: Record a calibration or verification
      description: |
        The expiry is derived (`performedAt` plus the profile's calibration validity, or the service
        default) and never supplied. Recording a calibration does **not** change the sensor status.
      operationId: recordCalibration
      x-status: implemented
      x-roles: [PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/SensorId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalibrationRequest' }
      responses:
        '201':
          description: Recorded (calibrations are not fetched by id, so there is no `Location`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calibration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sensors/{sensorId}/reassignment:
    post:
      tags: [Sensors]
      summary: Move the sensor to another asset
      description: Only while `IN_MAINTENANCE`, to a different asset; the sensor stays in maintenance. The previous association is kept in the history.
      operationId: reassignSensor
      x-status: implemented
      x-roles: [PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/SensorId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReassignmentRequest' }
      responses:
        '200':
          description: The updated sensor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sensor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sensors/{sensorId}/retirement:
    post:
      tags: [Sensors]
      summary: Retire the sensor
      description: Logical and final; nothing is deleted and the history stays readable.
      operationId: retireSensor
      x-status: implemented
      x-roles: [PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/SensorId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetirementRequest' }
      responses:
        '200':
          description: The retired sensor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sensor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sensors/{sensorId}/history:
    get:
      tags: [Sensors]
      summary: Administrative history of the sensor
      description: |
        Newest first. Every entry has who (`actorType` USER or SYSTEM, `actorId`), when, why and, when it
        applies, the value before and after. Automatic changes (calibration expiry) have `actorType`
        SYSTEM. Entries written by one operation share the same instant; their relative order is stable
        but has no chronological meaning.
      operationId: getSensorHistory
      x-status: implemented
      x-roles: [PLATFORM_ADMIN]
      parameters:
        - $ref: '#/components/parameters/SensorId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of history entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sensors/{sensorId}/readings:
    get:
      tags: [Telemetry]
      summary: Readings of a sensor
      description: |
        Newest first. `from` (inclusive) and `to` (exclusive) are required, and the range is at most 7
        days (`RANGE_TOO_WIDE`); the reading is returned whether or not it was eligible for evaluation
        (the readings of a sensor in maintenance are kept as evidence).
      operationId: listReadings
      x-status: implemented
      x-roles: [PLATFORM_ADMIN, OPERATIONS_SUPERVISOR]
      parameters:
        - $ref: '#/components/parameters/SensorId'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of readings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadingPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /telemetry/test-readings:
    post:
      tags: [Telemetry]
      summary: Inject test readings
      description: |
        Goes through the same evaluation path as the simulator: a reading outside the sensor's range is
        announced as a threshold breach (and, once the incident service consumes it, becomes an
        incident). Always answers `200` with one result per reading, in order: an invalid reading is
        `REJECTED` with a `rejectionCode` and never aborts the others. Idempotent per `readingId`:
        resending a batch answers `DUPLICATE` and announces nothing new. `readingId` is generated when
        absent and `recordedAt` defaults to now; keep the `readingId` to be able to resend safely. The
        batch has at most 500 readings (`BATCH_TOO_LARGE`).
      operationId: injectTestReadings
      x-status: implemented
      x-roles: [PLATFORM_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestReadingsRequest' }
      responses:
        '200':
          description: One result per reading, in input order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestReadingsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /incidents:
    get:
      tags: [Incidents]
      summary: List incidents
      operationId: listIncidents
      x-status: implemented
      x-roles: [OPERATIONS_SUPERVISOR, OPERATOR, MAINTENANCE_TECHNICIAN]
      parameters:
        - name: status
          in: query
          required: false
          description: Repeat to filter by several statuses.
          schema:
            type: array
            items: { $ref: '#/components/schemas/IncidentStatus' }
        - name: priority
          in: query
          required: false
          description: Repeat to filter by several priorities.
          schema:
            type: array
            items: { $ref: '#/components/schemas/Priority' }
        - name: assetId
          in: query
          required: false
          schema: { type: string }
        - name: sensorId
          in: query
          required: false
          schema: { type: string }
        - name: createdFrom
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: createdTo
          in: query
          required: false
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of incidents
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Incidents]
      summary: Create an incident (technical entry point)
      description: |
        **Legacy shape, do not integrate.** A technical entry point that exists only when the Gateway
        runs with `COLDGUARD_TECHNICAL_ENDPOINTS_ENABLED=true` (on in local Compose). Real incidents are
        created from telemetry. It will be replaced when SPEC-007 lands.
      operationId: createIncident
      x-status: implemented
      x-legacy: true
      x-roles: [PLATFORM_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LegacyCreateIncidentRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyCreateIncidentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /incidents/{incidentId}:
    get:
      tags: [Incidents]
      summary: Get an incident
      operationId: getIncident
      x-status: implemented
      x-roles: [OPERATIONS_SUPERVISOR, OPERATOR, MAINTENANCE_TECHNICIAN]
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        '200':
          description: The incident
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /incidents/{incidentId}/acknowledgement:
    post:
      tags: [Incidents]
      summary: Acknowledge an incident
      description: Moves `CREATED` to `ACKNOWLEDGED`. A second acknowledgement answers `409 INCIDENT_ALREADY_ACKNOWLEDGED`.
      operationId: acknowledgeIncident
      x-status: implemented
      x-roles: [OPERATIONS_SUPERVISOR]
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcknowledgementRequest' }
      responses:
        '200':
          description: The updated incident
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /incidents/{incidentId}/escalation:
    post:
      tags: [Incidents]
      summary: Escalate an incident
      description: A reason is required.
      operationId: escalateIncident
      x-status: implemented
      x-roles: [OPERATIONS_SUPERVISOR]
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EscalationRequest' }
      responses:
        '200':
          description: The updated incident
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /incidents/{incidentId}/close:
    post:
      tags: [Incidents]
      summary: Close an incident
      description: |
        Only the maintenance technician closes an incident. **Legacy response shape, do not integrate
        yet:** today it answers `LegacyCloseIncidentResponse`; with SPEC-007 it answers the full
        `Incident` (with `cause`, `resolutionComment`, `closedAt`, `closedBy` persisted).
      operationId: closeIncident
      x-status: implemented
      x-legacy: true
      x-roles: [MAINTENANCE_TECHNICIAN]
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseIncidentRequest' }
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyCloseIncidentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /metrics/incidents:
    get:
      tags: [Operations]
      summary: Operational metrics of incidents
      description: '`from` and `to` bound the incident creation time and are required.'
      operationId: getIncidentMetrics
      x-status: implemented
      x-roles: [OPERATIONS_SUPERVISOR]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: The metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentMetrics' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /audit-records:
    get:
      tags: [Operations]
      summary: Audit log
      description: Read-only. `from` and `to` are required; the server limits the range.
      operationId: listAuditRecords
      x-status: implemented
      x-roles: [AUDITOR]
      parameters:
        - name: entityType
          in: query
          required: false
          schema: { type: string }
        - name: entityId
          in: query
          required: false
          schema: { type: string }
        - name: actorId
          in: query
          required: false
          schema: { type: string }
        - name: action
          in: query
          required: false
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of audit records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditRecordPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The `accessToken` returned by `POST /auth/login`.
  headers:
    Location:
      description: URL of the created resource
      schema: { type: string }
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page number.
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      required: false
      description: Page size; 0 or omitted selects the server default (20); the maximum is 100.
      schema: { type: integer, minimum: 0, maximum: 100, default: 0 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor taken from `nextCursor`; omit it for the first page.
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string }
    SensorId:
      name: sensorId
      in: path
      required: true
      schema: { type: string }
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: |
        The request is not valid. `code` is `INVALID_REQUEST` (with `errors` naming each invalid field,
        never its value), `MALFORMED_REQUEST_BODY`, or a business code of the service.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthorized:
      description: No valid token, or `INVALID_CREDENTIALS` on login. Sign in again.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: The token is valid but its roles do not allow this operation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: |
        The resource does not exist (an id that is not valid cannot exist either). `code` names it:
        `ASSET_NOT_FOUND`, `SITE_NOT_FOUND`, `SENSOR_NOT_FOUND`, `ORGANIZATION_NOT_FOUND`,
        `PROFILE_NOT_FOUND`, `USER_NOT_FOUND`, `INCIDENT_NOT_FOUND`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: |
        The state does not allow it, or the data clashes. `CONCURRENT_MODIFICATION` means someone else
        changed the resource: reload it and retry. Others: `SENSOR_SERIAL_DUPLICATED`,
        `ORGANIZATION_NAME_DUPLICATED`, `SITE_NAME_DUPLICATED`, `USER_ALREADY_EXISTS`,
        `USER_STATE_CONFLICT`, `SENSOR_TRANSITION_NOT_ALLOWED`, `CALIBRATION_EVIDENCE_REQUIRED`,
        `CALIBRATION_EXPIRED`, `CALIBRATION_VALIDITY_NOT_CONFIGURED`, `REASSIGNMENT_NOT_ALLOWED`,
        `INCIDENT_ALREADY_EXISTS`, `INCIDENT_ALREADY_ACKNOWLEDGED`, `INCIDENT_ALREADY_CLOSED`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    BadGateway:
      description: |
        A downstream service failed: `UPSTREAM_ERROR` (502), `UPSTREAM_UNAVAILABLE` (503) or
        `UPSTREAM_TIMEOUT` (504). The internal cause is never exposed; the `correlationId` identifies it
        in the logs.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
  schemas:
    ProblemDetail:
      type: object
      required: [title, status, code]
      properties:
        type: { type: string, example: "about:blank" }
        title: { type: string, example: Conflict }
        status: { type: integer, example: 409 }
        detail: { type: string }
        instance: { type: string, description: Path of the request. }
        code:
          type: string
          description: Stable machine-readable code; branch on this, not on `detail`.
          example: SENSOR_TRANSITION_NOT_ALLOWED
        correlationId: { type: string }
        errors:
          type: array
          description: Present on `INVALID_REQUEST`; one entry per invalid field.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, example: reason }
              message: { type: string, example: must not be blank }
    PageInfo:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    Role:
      type: string
      enum: [OPERATIONS_SUPERVISOR, OPERATOR, MAINTENANCE_TECHNICIAN, AUDITOR, PLATFORM_ADMIN]
    Criticality:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    SensorStatus:
      type: string
      enum: [ACTIVE, IN_MAINTENANCE, INACTIVE, RETIRED]
    CalibrationKind:
      type: string
      enum: [CALIBRATION, VERIFICATION]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 128 }
        password: { type: string, maxLength: 128, format: password }
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, format: int64, description: Seconds until it expires. }
    User:
      type: object
      required: [userId, username, email, displayName, roles, enabled, createdAt]
      properties:
        userId: { type: string }
        username: { type: string }
        email: { type: string }
        displayName: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
    UserPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        page: { $ref: '#/components/schemas/PageInfo' }
    CreateUserRequest:
      type: object
      required: [username, email, displayName, initialPassword, roles]
      properties:
        username: { type: string }
        email: { type: string }
        displayName: { type: string }
        initialPassword: { type: string, format: password }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
    RoleChangeRequest:
      type: object
      required: [role, reason]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        reason: { type: string }
    EnabledRequest:
      type: object
      required: [enabled, reason]
      properties:
        enabled: { type: boolean }
        reason: { type: string }
    Organization:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    OrganizationPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Organization' }
        page: { $ref: '#/components/schemas/PageInfo' }
    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
    Site:
      type: object
      required: [id, organizationId, name, createdAt]
      properties:
        id: { type: string }
        organizationId: { type: string }
        name: { type: string }
        address: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    SitePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Site' }
        page: { $ref: '#/components/schemas/PageInfo' }
    CreateSiteRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        address: { type: string, maxLength: 250 }
    Asset:
      type: object
      required: [id, siteId, name, criticality, createdAt, updatedAt, version]
      properties:
        id: { type: string }
        siteId: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        criticality: { $ref: '#/components/schemas/Criticality' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, description: Send it back as `expectedVersion` when updating. }
    AssetPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Asset' }
        page: { $ref: '#/components/schemas/PageInfo' }
    RegisterAssetRequest:
      type: object
      required: [siteId, name, criticality]
      properties:
        siteId: { type: string }
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        criticality: { $ref: '#/components/schemas/Criticality' }
    UpdateAssetRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64 }
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        criticality: { $ref: '#/components/schemas/Criticality' }
    Sensor:
      type: object
      required: [id, serialNumber, measurementUnit, assetId, status, statusChangedAt, createdAt, updatedAt, version]
      properties:
        id: { type: string }
        serialNumber: { type: string }
        model: { type: string, nullable: true }
        measurementUnit: { type: string, example: CELSIUS }
        assetId: { type: string }
        status: { $ref: '#/components/schemas/SensorStatus' }
        statusChangedAt: { type: string, format: date-time }
        lastCalibrationRecordedAt: { type: string, format: date-time, nullable: true }
        lastCalibrationValidUntil: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    SensorPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Sensor' }
        page: { $ref: '#/components/schemas/PageInfo' }
    InitialCalibration:
      type: object
      required: [kind, performedAt, reason]
      properties:
        kind: { $ref: '#/components/schemas/CalibrationKind' }
        performedAt: { type: string, format: date-time }
        reason: { type: string, maxLength: 500 }
    RegisterSensorRequest:
      type: object
      required: [assetId, serialNumber, measurementUnit]
      properties:
        assetId: { type: string }
        serialNumber: { type: string, maxLength: 80 }
        model: { type: string, maxLength: 80 }
        measurementUnit: { type: string, maxLength: 20, example: CELSIUS }
        initialCalibration: { $ref: '#/components/schemas/InitialCalibration' }
        profile: { $ref: '#/components/schemas/OperationalProfileRequest' }
    UpdateSensorRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64 }
        serialNumber: { type: string, maxLength: 80 }
        model: { type: string, maxLength: 80 }
    MagnitudeBands:
      type: object
      required: [mediumFrom, highFrom, criticalFrom]
      description: Deviation, in the profile's unit, from which an anomaly reaches each magnitude (0 < medium < high < critical).
      properties:
        mediumFrom: { type: number, format: double }
        highFrom: { type: number, format: double }
        criticalFrom: { type: number, format: double }
    Persistence:
      type: object
      required: [minConsecutiveBreaches, windowSeconds]
      description: An anomaly is persistent after this many consecutive out-of-range readings within the window.
      properties:
        minConsecutiveBreaches: { type: integer }
        windowSeconds: { type: integer }
    OperationalProfileRequest:
      type: object
      required: [minTemperature, maxTemperature, unit, magnitudeBands, persistence, expectedReadingIntervalSeconds]
      properties:
        minTemperature: { type: number, format: double }
        maxTemperature: { type: number, format: double }
        unit: { type: string, maxLength: 20, description: Must match the sensor's measurement unit. }
        magnitudeBands: { $ref: '#/components/schemas/MagnitudeBands' }
        persistence: { $ref: '#/components/schemas/Persistence' }
        expectedReadingIntervalSeconds: { type: integer }
        calibrationValiditySeconds: { type: integer, format: int64, nullable: true, description: When absent, the service default applies. }
        version: { type: integer, format: int64, description: The version you read; absent or 0 when creating. }
    OperationalProfile:
      type: object
      required: [sensorId, minTemperature, maxTemperature, unit, magnitudeBands, persistence, expectedReadingIntervalSeconds, version, updatedAt]
      properties:
        sensorId: { type: string }
        minTemperature: { type: number, format: double }
        maxTemperature: { type: number, format: double }
        unit: { type: string }
        magnitudeBands: { $ref: '#/components/schemas/MagnitudeBands' }
        persistence: { $ref: '#/components/schemas/Persistence' }
        expectedReadingIntervalSeconds: { type: integer }
        calibrationValiditySeconds: { type: integer, format: int64, nullable: true }
        version: { type: integer, format: int64, description: Starts at 1; send it back as `version` when replacing. }
        updatedAt: { type: string, format: date-time }
    StatusChangeRequest:
      type: object
      required: [targetStatus, reason]
      properties:
        targetStatus: { $ref: '#/components/schemas/SensorStatus' }
        reason: { type: string, maxLength: 500 }
    CalibrationRequest:
      type: object
      required: [kind, performedAt, reason]
      properties:
        kind: { $ref: '#/components/schemas/CalibrationKind' }
        performedAt: { type: string, format: date-time, description: Must not be in the future. }
        reason: { type: string, maxLength: 500 }
    Calibration:
      type: object
      required: [id, sensorId, kind, performedAt, validUntil, recordedAt, recordedBy, reason]
      properties:
        id: { type: string }
        sensorId: { type: string }
        kind: { $ref: '#/components/schemas/CalibrationKind' }
        performedAt: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        recordedBy: { type: string }
        reason: { type: string }
    ReassignmentRequest:
      type: object
      required: [targetAssetId, reason]
      properties:
        targetAssetId: { type: string }
        reason: { type: string, maxLength: 500 }
    RetirementRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 500 }
    HistoryEntry:
      type: object
      required: [id, action, actorType, actorId, occurredAt]
      properties:
        id: { type: string }
        action:
          type: string
          description: The kind of change.
          enum: [REGISTERED, TECHNICAL_DATA_UPDATED, PROFILE_UPDATED, STATUS_CHANGED, CALIBRATION_RECORDED, REASSIGNED, RETIRED]
        previousValue: { type: object, additionalProperties: true, nullable: true }
        newValue: { type: object, additionalProperties: true, nullable: true }
        reason: { type: string, nullable: true }
        actorType: { type: string, enum: [USER, SYSTEM] }
        actorId: { type: string, description: A user id, or the process name for SYSTEM (for example `calibration-expiry-job`). }
        occurredAt: { type: string, format: date-time }
    HistoryPage:
      type: object
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HistoryEntry' }
        nextCursor: { type: string, description: Empty on the last page. }
        hasMore: { type: boolean }
    ReadingSource:
      type: string
      enum: [SIMULATOR, TEST_INJECTION]
    MagnitudeLevel:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    TestReading:
      type: object
      required: [sensorId, value, unit]
      properties:
        readingId: { type: string, description: A UUID that makes the injection idempotent; generated when absent. }
        sensorId: { type: string }
        recordedAt: { type: string, format: date-time, description: When the reading was taken; defaults to now. }
        value: { type: number, format: double, description: In the profile's unit, at most 3 decimals are kept. }
        unit: { type: string, maxLength: 20, description: Must match the sensor's profile unit, otherwise the reading is rejected with `UNIT_MISMATCH`. }
    TestReadingsRequest:
      type: object
      required: [readings]
      properties:
        readings:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/TestReading' }
    ReadingResult:
      type: object
      required: [readingId, outcome]
      properties:
        readingId: { type: string }
        outcome: { type: string, enum: [ACCEPTED, DUPLICATE, REJECTED] }
        eligible: { type: boolean, description: False when the sensor is not ACTIVE or has no profile (the reading is still kept as evidence). }
        breached: { type: boolean, description: True when the reading is an anomaly. }
        rejectionCode:
          type: string
          nullable: true
          description: Set only when REJECTED.
          enum: [INVALID_READING_ID, INVALID_SENSOR_ID, INVALID_RECORDED_AT, RECORDED_AT_IN_FUTURE, INVALID_UNIT, INVALID_VALUE, SENSOR_NOT_FOUND, UNIT_MISMATCH, null]
    TestReadingsResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/ReadingResult' }
    ReadingView:
      type: object
      required: [readingId, sensorId, assetId, recordedAt, receivedAt, value, unit, source, eligible, breached]
      properties:
        readingId: { type: string }
        sensorId: { type: string }
        assetId: { type: string }
        recordedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        value: { type: number, format: double }
        unit: { type: string }
        source: { $ref: '#/components/schemas/ReadingSource' }
        eligible: { type: boolean }
        ineligibilityReason: { type: string, nullable: true, enum: [SENSOR_NOT_ACTIVE, NO_PROFILE, null] }
        breached: { type: boolean }
        anomalyType: { type: string, nullable: true }
        magnitude:
          allOf:
            - { $ref: '#/components/schemas/MagnitudeLevel' }
          nullable: true
    ReadingPage:
      type: object
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReadingView' }
        nextCursor: { type: string }
        hasMore: { type: boolean }
    Connectivity:
      type: object
      required: [sensorId, assetId, expectedReadingIntervalSeconds]
      properties:
        sensorId: { type: string }
        assetId: { type: string }
        lastReadingAt: { type: string, format: date-time, nullable: true }
        expectedReadingIntervalSeconds: { type: integer }
        connectivityLostAt: { type: string, format: date-time, nullable: true, description: Absent while connected. }
    ConnectivityPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Connectivity' }
        page: { $ref: '#/components/schemas/PageInfo' }
    IncidentStatus:
      type: string
      enum: [CREATED, ACKNOWLEDGED, ESCALATED, CLOSED]
    Priority:
      type: string
      enum: [P1, P2, P3, P4]
    Impact:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    Urgency:
      type: string
      enum: [LOW, MEDIUM, HIGH, IMMEDIATE]
    Incident:
      type: object
      required: [id, status, assetId, sensorId, anomalyType, impact, urgency, priority, createdAt, escalationCount, occurrenceCount]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        assetId: { type: string }
        sensorId: { type: string }
        anomalyType: { type: string, example: HIGH_TEMPERATURE }
        impact: { $ref: '#/components/schemas/Impact' }
        urgency: { $ref: '#/components/schemas/Urgency' }
        priority: { $ref: '#/components/schemas/Priority' }
        createdAt: { type: string, format: date-time }
        ackDueAt: { type: string, format: date-time, nullable: true }
        resolveDueAt: { type: string, format: date-time, nullable: true, description: Absent when the priority has no resolution target. }
        acknowledgedAt: { type: string, format: date-time, nullable: true }
        acknowledgedBy: { type: string, nullable: true }
        lastEscalatedAt: { type: string, format: date-time, nullable: true }
        escalationCount: { type: integer }
        closedAt: { type: string, format: date-time, nullable: true }
        closedBy: { type: string, nullable: true }
        cause: { type: string, nullable: true }
        resolutionComment: { type: string, nullable: true }
        occurrenceCount: { type: integer, description: Equivalent anomalies seen while the incident is open. }
        lastOccurrenceAt: { type: string, format: date-time, nullable: true }
    IncidentPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Incident' }
        page: { $ref: '#/components/schemas/PageInfo' }
    AcknowledgementRequest:
      type: object
      properties:
        note: { type: string, maxLength: 500 }
    EscalationRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 500 }
    CloseIncidentRequest:
      type: object
      required: [cause, resolutionComment]
      properties:
        cause: { type: string, maxLength: 500 }
        resolutionComment: { type: string, maxLength: 500 }
    LegacyCreateIncidentRequest:
      type: object
      description: Protocol-prefixed vocabulary; do not integrate. Replaced by SPEC-007.
      properties:
        assetId: { type: string }
        assetCriticality: { type: string, enum: [CRITICALITY_LOW, CRITICALITY_MEDIUM, CRITICALITY_HIGH, CRITICALITY_CRITICAL] }
        sensorId: { type: string }
        anomalyType: { type: string }
        magnitude: { type: string, enum: [MAGNITUDE_LOW, MAGNITUDE_MEDIUM, MAGNITUDE_HIGH, MAGNITUDE_CRITICAL] }
        persistent: { type: boolean }
        correlationId: { type: string }
    LegacyCreateIncidentResponse:
      type: object
      description: Protocol-prefixed vocabulary; do not integrate. Replaced by SPEC-007.
      properties:
        incidentId: { type: string }
        status: { type: string }
        impact: { type: string, example: IMPACT_HIGH }
        urgency: { type: string, example: URGENCY_IMMEDIATE }
        priority: { type: string, example: P1 }
        createdAt: { type: string }
    LegacyCloseIncidentResponse:
      type: object
      description: Replaced by the full `Incident` in SPEC-007; do not integrate.
      properties:
        incidentId: { type: string }
        status: { type: string, example: CLOSED }
        closedAt: { type: string }
    IncidentMetrics:
      type: object
      required: [countByStatus, countByPriority, byPriority]
      properties:
        countByStatus:
          type: object
          additionalProperties: { type: integer, format: int64 }
          description: Keys are incident statuses.
        countByPriority:
          type: object
          additionalProperties: { type: integer, format: int64 }
          description: Keys are P1 to P4.
        mttaSeconds: { type: number, format: double, nullable: true, description: Mean time to acknowledge; absent when none was acknowledged. }
        mttrSeconds: { type: number, format: double, nullable: true, description: Mean time to resolve; absent when none was closed. }
        byPriority:
          type: array
          items: { $ref: '#/components/schemas/PriorityMetrics' }
    PriorityMetrics:
      type: object
      required: [priority, total, acknowledged, acknowledgedOnTime, closed, closedOnTime]
      properties:
        priority: { $ref: '#/components/schemas/Priority' }
        total: { type: integer, format: int64 }
        acknowledged: { type: integer, format: int64 }
        acknowledgedOnTime: { type: integer, format: int64 }
        closed: { type: integer, format: int64 }
        closedOnTime: { type: integer, format: int64 }
        ackComplianceRatio: { type: number, format: double, nullable: true, description: Absent when nothing is evaluable. }
        resolveComplianceRatio: { type: number, format: double, nullable: true }
    AuditRecord:
      type: object
      required: [id, occurredAt, sourceService, entityType, entityId, action, actorType, actorId]
      properties:
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        sourceService: { type: string, example: incident-service }
        entityType: { type: string, example: Incident }
        entityId: { type: string }
        action: { type: string }
        actorType: { type: string, enum: [USER, SYSTEM] }
        actorId: { type: string }
        reason: { type: string, nullable: true }
        previousValue: { type: object, additionalProperties: true, nullable: true }
        newValue: { type: object, additionalProperties: true, nullable: true }
        correlationId: { type: string, nullable: true }
    AuditRecordPage:
      type: object
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditRecord' }
        nextCursor: { type: string }
        hasMore: { type: boolean }
