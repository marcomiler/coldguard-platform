syntax = "proto3";

package com.coldguard.telemetry.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "common/v1/common.proto";

option java_package = "com.coldguard.telemetry.grpc.v1";
option java_multiple_files = true;

// Servers: telemetry-service. Clients: sensor-simulator (IngestReadings, mTLS client identity
// `sensor-simulator`) and Gateway (every RPC, on behalf of an authenticated user).
service TelemetryService {
  // Both origins (simulator and test injection) go through the same evaluation path; `source`
  // is stored as evidence and never changes how a reading is evaluated.
  rpc IngestReadings(IngestReadingsRequest) returns (IngestReadingsResponse);
  rpc ListReadings(ListReadingsRequest) returns (ListReadingsResponse);
  rpc ListConnectivityStatus(ListConnectivityStatusRequest) returns (ListConnectivityStatusResponse);
}

enum ReadingSource {
  READING_SOURCE_UNSPECIFIED = 0;
  READING_SOURCE_SIMULATOR = 1;
  READING_SOURCE_TEST_INJECTION = 2;
}

enum MagnitudeLevel {
  MAGNITUDE_LEVEL_UNSPECIFIED = 0;
  MAGNITUDE_LEVEL_LOW = 1;
  MAGNITUDE_LEVEL_MEDIUM = 2;
  MAGNITUDE_LEVEL_HIGH = 3;
  MAGNITUDE_LEVEL_CRITICAL = 4;
}

message Reading {
  string reading_id = 1; // UUID generated by the producer; makes ingestion idempotent
  string sensor_id = 2;
  google.protobuf.Timestamp recorded_at = 3; // origin timestamp
  double value = 4;
  string unit = 5;
}

// The server rejects batches above its configured maximum with INVALID_ARGUMENT.
message IngestReadingsRequest {
  ReadingSource source = 1;
  repeated Reading readings = 2;
}

// One result per input reading, in input order. An invalid reading never aborts the others.
message ReadingResult {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_ACCEPTED = 1;
    OUTCOME_DUPLICATE = 2;
    OUTCOME_REJECTED = 3;
  }
  string reading_id = 1;
  Outcome outcome = 2;
  bool eligible = 3;  // false when the sensor is not ACTIVE or has no profile
  bool breached = 4;  // true when the reading is an anomaly
  string rejection_code = 5; // e.g. SENSOR_NOT_FOUND, UNIT_MISMATCH
}

message IngestReadingsResponse {
  repeated ReadingResult results = 1;
}

// `from`/`to` are required; the server limits the range it will serve.
message ListReadingsRequest {
  string sensor_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  com.coldguard.common.v1.CursorPageRequest page = 4;
}

message ReadingView {
  string reading_id = 1;
  string sensor_id = 2;
  string asset_id = 3;
  google.protobuf.Timestamp recorded_at = 4;
  google.protobuf.Timestamp received_at = 5;
  double value = 6;
  string unit = 7;
  ReadingSource source = 8;
  bool eligible = 9;
  string ineligibility_reason = 10; // SENSOR_NOT_ACTIVE | NO_PROFILE
  bool breached = 11;
  string anomaly_type = 12;
  MagnitudeLevel magnitude = 13;
}

message ListReadingsResponse {
  repeated ReadingView readings = 1;
  com.coldguard.common.v1.CursorPageInfo page = 2;
}

message ListConnectivityStatusRequest {
  bool only_lost = 1;
  com.coldguard.common.v1.PageRequest page = 2;
}

// Connectivity is independent from the sensor lifecycle status.
message ConnectivityStatus {
  string sensor_id = 1;
  string asset_id = 2;
  google.protobuf.Timestamp last_reading_at = 3;
  google.protobuf.Duration expected_reading_interval = 4;
  google.protobuf.Timestamp connectivity_lost_at = 5; // unset while connected
}

message ListConnectivityStatusResponse {
  repeated ConnectivityStatus statuses = 1;
  com.coldguard.common.v1.PageInfo page = 2;
}
