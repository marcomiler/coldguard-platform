server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: asset-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  grpc:
    server:
      # Explicit per-service gRPC port (9091 asset, 9092 telemetry, 9093 incident) so no service
      # collides with Prometheus on 9090 when run on the host.
      port: ${GRPC_SERVER_PORT:9091}
      ssl:
        enabled: true
        bundle: asset-service-server
        # mTLS: a call without a client certificate signed by the local dev CA is rejected at the
        # TLS handshake, before any application code runs.
        client-auth: require
  ssl:
    bundle:
      pem:
        asset-service-server:
          keystore:
            certificate: file:${TLS_CERTS_DIR:../../deploy/local/certs}/asset-service/asset-service.crt
            private-key: file:${TLS_CERTS_DIR:../../deploy/local/certs}/asset-service/asset-service.key
          truststore:
            certificate: file:${TLS_CERTS_DIR:../../deploy/local/certs}/ca/ca.crt
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coldguard}?currentSchema=asset
    username: ${DB_USER:coldguard}
    password: ${DB_PASSWORD:coldguard}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:coldguard}
    password: ${RABBITMQ_PASSWORD:coldguard}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: ${RABBITMQ_PREFETCH:10}
        concurrency: ${RABBITMQ_CONCURRENCY:1}
        retry:
          enabled: true
          max-retries: ${RABBITMQ_RETRY_MAX:3}
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  flyway:
    schemas: asset
    create-schemas: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

coldguard:
  security:
    # Internal services that call Asset with their own certificate, not on behalf of a user
    # (Telemetry reads the evaluation context). Identity metadata from them is ignored.
    system-callers: ${ASSET_SYSTEM_CALLERS:telemetry-service}
  asset:
    calibration:
      # Validity applied to a calibration when the sensor's profile defines none. Empty means no
      # default: recording a calibration is then refused rather than inventing a value.
      default-validity: ${ASSET_CALIBRATION_DEFAULT_VALIDITY:}
    calibration-expiry:
      # Moves sensors with an expired calibration to maintenance (RN-018). Single instance only.
      enabled: ${ASSET_CALIBRATION_EXPIRY_ENABLED:true}
      # Every 5 minutes (academic placeholder, configurable).
      cron: ${ASSET_CALIBRATION_EXPIRY_CRON:0 */5 * * * *}
      batch-size: 100
    page:
      max-size: 100
  outbox:
    enabled: true
    poll-interval: 500ms
    batch-size: 100
    confirm-timeout: 5s
    retention: 7d
    max-attempts: 20
  inbox:
    retention: 7d

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
