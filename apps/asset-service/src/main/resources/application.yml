server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: asset-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coldguard}?currentSchema=asset
    username: ${DB_USER:coldguard}
    password: ${DB_PASSWORD:coldguard}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:coldguard}
    password: ${RABBITMQ_PASSWORD:coldguard}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: ${RABBITMQ_PREFETCH:10}
        concurrency: ${RABBITMQ_CONCURRENCY:1}
        retry:
          enabled: true
          max-retries: ${RABBITMQ_RETRY_MAX:3}
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  flyway:
    schemas: asset
    create-schemas: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

coldguard:
  outbox:
    enabled: true
    poll-interval: 500ms
    batch-size: 100
    confirm-timeout: 5s
    retention: 7d
    max-attempts: 20
  inbox:
    retention: 7d

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
