server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: incident-service
  config:
    import: optional:classpath:coldguard-observability.yml
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  grpc:
    server:
      # Explicit per-service gRPC port (9091 asset, 9092 telemetry, 9093 incident) so no service
      # collides with Prometheus on 9090 when run on the host.
      port: ${GRPC_SERVER_PORT:9093}
      ssl:
        enabled: true
        bundle: incident-service-server
        # (mTLS): only the Gateway's certificate, signed by the local dev CA, is
        # accepted — a call without a client certificate is rejected at the TLS handshake,
        # before ActorRoleServerInterceptor or any application code runs.
        client-auth: require
  ssl:
    bundle:
      pem:
        incident-service-server:
          keystore:
            certificate: file:${TLS_CERTS_DIR:../../deploy/local/certs}/incident-service/incident-service.crt
            private-key: file:${TLS_CERTS_DIR:../../deploy/local/certs}/incident-service/incident-service.key
          truststore:
            # Trusts only the local dev CA (deploy/scripts/generate-dev-certs.sh) — not the
            # Gateway's certificate directly, so any leaf certificate that CA signs is
            # accepted without listing client certificates one by one.
            certificate: file:${TLS_CERTS_DIR:../../deploy/local/certs}/ca/ca.crt
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coldguard}?currentSchema=incident
    username: ${DB_USER:coldguard}
    password: ${DB_PASSWORD:coldguard}
  flyway:
    # The first schema is the default one (history table, unqualified migrations).
    schemas: incident,identity,auditlog
    create-schemas: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:coldguard}
    password: ${RABBITMQ_PASSWORD:coldguard}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: ${RABBITMQ_PREFETCH:10}
        concurrency: ${RABBITMQ_CONCURRENCY:1}
        retry:
          enabled: true
          max-retries: ${RABBITMQ_RETRY_MAX:3}
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

coldguard:
  incident:
    # Academic placeholders (docs/quality/sla-kpi.md), not confirmed business targets.
    # P4 has no resolution target; its acknowledgement of "1 business day" is approximated by 1 day.
    sla:
      P1: { ack: PT5M, resolve: PT30M }
      P2: { ack: PT15M, resolve: PT2H }
      P3: { ack: PT1H, resolve: PT8H }
      P4: { ack: P1D }
    page:
      default-size: 20
      max-size: 100
  auditlog:
    query:
      max-range: 31d
      default-page-size: 50
      max-page-size: 200
  identity:
    lockout:
      max-attempts: ${IDENTITY_LOCKOUT_MAX_ATTEMPTS:5}
      duration: ${IDENTITY_LOCKOUT_DURATION:15m}
    password:
      min-length: ${IDENTITY_PASSWORD_MIN_LENGTH:8}
    bootstrap:
      # Local Compose only; creates one demo user per role. Needs DEMO_USERS_PASSWORD.
      enabled: ${IDENTITY_BOOTSTRAP_ENABLED:false}
      demo-password: ${DEMO_USERS_PASSWORD:}
  outbox:
    enabled: true
    poll-interval: 500ms
    batch-size: 100
    confirm-timeout: 5s
    retention: 7d
    max-attempts: 20
  inbox:
    retention: 7d

management:
  endpoint:
    health:
      group:
        readiness:
          # Own dependencies only (database and broker), never another service: a service that
          # is down must not cascade into the readiness of the ones that call it.
          include: readinessState,db,rabbit
