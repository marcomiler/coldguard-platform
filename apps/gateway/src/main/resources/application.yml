server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  grpc:
    client:
      channels:
        incident-service:
          address: static://${INCIDENT_SERVICE_HOST:localhost}:${INCIDENT_SERVICE_GRPC_PORT:9093}
          ssl:
            enabled: true
            # (mTLS): presents the Gateway's own certificate as a gRPC client and
            # trusts only the local dev CA — negotiation-type is left at its default because
            # Spring gRPC's channel-credentials provider only looks at ssl.enabled/ssl.bundle.
            bundle: gateway-client
  ssl:
    bundle:
      pem:
        gateway-client:
          keystore:
            certificate: file:${TLS_CERTS_DIR:../../deploy/local/certs}/gateway/gateway.crt
            private-key: file:${TLS_CERTS_DIR:../../deploy/local/certs}/gateway/gateway.key
          truststore:
            certificate: file:${TLS_CERTS_DIR:../../deploy/local/certs}/ca/ca.crt

coldguard:
  gateway:
    cors:
      # Explicit origins only ('*' is rejected at startup); empty means no cross-origin access.
      allowed-origins: ${COLDGUARD_CORS_ALLOWED_ORIGINS:}
    technical-endpoints:
      # POST /api/v1/incidents is a technical entry point, closed unless explicitly enabled.
      enabled: ${COLDGUARD_TECHNICAL_ENDPOINTS_ENABLED:false}
  security:
    jwt:
      # Required, no defaults: the gateway refuses to start without its key pair. Generate them
      # with deploy/scripts/generate-dev-certs.sh.
      issuer: ${JWT_ISSUER:coldguard-local}
      private-key-path: ${JWT_PRIVATE_KEY_PATH:}
      public-key-path: ${JWT_PUBLIC_KEY_PATH:}
      ttl: ${JWT_TTL:1h}
      clock-skew: ${JWT_CLOCK_SKEW:30s}

management:
  server:
    # Separate port so actuator is reachable inside the Compose network but is not part of the
    # public REST surface published on 8080.
    port: ${MANAGEMENT_PORT:8090}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
