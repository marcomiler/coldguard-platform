server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: notification-service
  config:
    import: optional:classpath:coldguard-observability.yml
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  datasource:
    # Notification Service owns the `notification` logical schema.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coldguard}?currentSchema=notification
    username: ${DB_USER:coldguard}
    password: ${DB_PASSWORD:coldguard}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:coldguard}
    password: ${RABBITMQ_PASSWORD:coldguard}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: ${RABBITMQ_PREFETCH:10}
        concurrency: ${RABBITMQ_CONCURRENCY:1}
        retry:
          enabled: true
          max-retries: ${RABBITMQ_RETRY_MAX:3}
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      # A slow mail server must never block the consumer indefinitely.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  flyway:
    schemas: notification
    create-schemas: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

coldguard:
  notification:
    channel: smtp
    from: ${NOTIFICATION_FROM:coldguard-local@example.invalid}
  outbox:
    enabled: true
    poll-interval: 500ms
    batch-size: 100
    confirm-timeout: 5s
    retention: 7d
    max-attempts: 20
  inbox:
    retention: 7d

management:
  endpoint:
    health:
      group:
        readiness:
          # Own dependencies only (database and broker), never another service: a service that
          # is down must not cascade into the readiness of the ones that call it.
          include: readinessState,db,rabbit
  health:
    mail:
      # A mail server that is down must not make the service unready; failures are retried instead.
      enabled: false
