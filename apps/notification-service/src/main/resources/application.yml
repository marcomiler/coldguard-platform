server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  datasource:
    # No logical schema name is fixed yet: bounded-contexts.md does not confirm one for
    # Notification Service. Points at the default schema until that ownership is decided.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coldguard}
    username: ${DB_USER:coldguard}
    password: ${DB_PASSWORD:coldguard}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
