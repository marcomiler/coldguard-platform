server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: telemetry-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  grpc:
    server:
      # Explicit per-service gRPC port (9091 asset, 9092 telemetry, 9093 incident).
      port: ${GRPC_SERVER_PORT:9092}
      ssl:
        enabled: true
        bundle: telemetry-service-server
        # mTLS: only certificates signed by the local dev CA are accepted.
        client-auth: require
    client:
      channels:
        asset-service:
          address: static://${ASSET_SERVICE_HOST:localhost}:${ASSET_SERVICE_GRPC_PORT:9091}
          ssl:
            enabled: true
            # This service presents its own certificate (CN telemetry-service) to Asset, which
            # recognizes it as an internal caller, and trusts only the local dev CA.
            bundle: telemetry-service-client
  ssl:
    bundle:
      pem:
        telemetry-service-server:
          keystore:
            certificate: file:${TLS_CERTS_DIR:../../deploy/local/certs}/telemetry-service/telemetry-service.crt
            private-key: file:${TLS_CERTS_DIR:../../deploy/local/certs}/telemetry-service/telemetry-service.key
          truststore:
            certificate: file:${TLS_CERTS_DIR:../../deploy/local/certs}/ca/ca.crt
        telemetry-service-client:
          keystore:
            certificate: file:${TLS_CERTS_DIR:../../deploy/local/certs}/telemetry-service/telemetry-service.crt
            private-key: file:${TLS_CERTS_DIR:../../deploy/local/certs}/telemetry-service/telemetry-service.key
          truststore:
            certificate: file:${TLS_CERTS_DIR:../../deploy/local/certs}/ca/ca.crt
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coldguard}?currentSchema=telemetry
    username: ${DB_USER:coldguard}
    password: ${DB_PASSWORD:coldguard}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:coldguard}
    password: ${RABBITMQ_PASSWORD:coldguard}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: ${RABBITMQ_PREFETCH:10}
        concurrency: ${RABBITMQ_CONCURRENCY:1}
        retry:
          enabled: true
          max-retries: ${RABBITMQ_RETRY_MAX:3}
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  flyway:
    schemas: telemetry
    create-schemas: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

coldguard:
  security:
    # Internal services that call Telemetry with their own certificate, not for a user. The
    # simulator may ingest simulated readings; it can do nothing else.
    system-callers: ${TELEMETRY_SYSTEM_CALLERS:sensor-simulator}
  telemetry:
    ingest:
      max-batch-size: 500
      # A reading stamped further ahead than this is rejected (clock skew allowance).
      future-tolerance: 30s
    evaluation-context-cache:
      ttl: 60s
      max-size: 10000
    asset-call-deadline: 2s
    connectivity:
      enabled: true
      # Academic placeholders, not confirmed by the business: a sensor is flagged once
      # expected interval x tolerance-factor has passed without a reading.
      check-interval: ${TELEMETRY_CONNECTIVITY_CHECK_INTERVAL:30s}
      tolerance-factor: 1.5
      batch-size: 100
    readings-query:
      max-range: 7d
    page:
      max-size: 100
      default-size: 20
  outbox:
    enabled: true
    poll-interval: 500ms
    batch-size: 100
    confirm-timeout: 5s
    retention: 7d
    max-attempts: 20
  inbox:
    retention: 7d

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
