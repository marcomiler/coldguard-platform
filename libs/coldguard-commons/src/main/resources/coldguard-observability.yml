# Observability defaults shared by every service that imports it
# (spring.config.import: optional:classpath:coldguard-observability.yml). A service's own
# application.yml wins over these values.
#
# - Metrics: Prometheus scrapes /actuator/prometheus; latency histograms only for the meters that
#   need percentiles (HTTP server, gRPC, AMQP listeners) so the series count stays bounded.
# - Traces: OTLP over HTTP to the OpenTelemetry Collector, sampled 100 % locally. Export is off
#   unless TRACING_EXPORT_ENABLED=true (the observability profile sets it), so a stack without a
#   collector does not log export errors.
# - Logs: one JSON object per line on stdout (12-factor); traceId/spanId and the MDC
#   (correlationId) are part of every line.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: local
    distribution:
      percentiles-histogram:
        http.server.requests: true
        grpc.server: true
        grpc.client: true
        spring.rabbit.listener: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

spring:
  rabbitmq:
    listener:
      simple:
        # A consumer's span continues the trace of the producer: the Outbox keeps the producer's
        # traceparent and the relay sends it as a header (see OutboxWriter).
        observation-enabled: true
    template:
      # The relay publishes from a scheduler thread with no trace of its own; observing the
      # template would replace the producer's traceparent kept in the outbox row.
      observation-enabled: false

logging:
  structured:
    format:
      console: logstash
  level:
    com.coldguard: ${LOGGING_LEVEL_COM_COLDGUARD:INFO}
